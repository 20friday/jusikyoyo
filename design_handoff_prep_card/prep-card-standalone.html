<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PICK 준비중 카드 — 단독 레퍼런스</title>
  <link rel="stylesheet" href="assets/global.css" />
  <style>
    body { background: var(--bg); padding: 24px 16px; }
    .ref-wrap { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .ref-section h2 {
      font-size: 13px; font-weight: 800; color: var(--text-3);
      letter-spacing: 0.04em; text-transform: uppercase;
      margin: 24px 0 8px;
    }
    .ref-section:first-child h2 { margin-top: 0; }

    /* ===== PREP CARD — Variant E ===== */
    .prep {
      background: var(--card);
      border-radius: 16px;
      padding: 18px 20px;
      border: 1px solid var(--border);
      font-family: var(--font);
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 16px;
      align-items: center;
      overflow: hidden;
    }
    .prep-cow-slot {
      width: 126px; height: 108px;
      display: flex; align-items: center; justify-content: center;
      background: #fff7ef;
      border-radius: 14px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
    .prep-cow-slot::before {
      content: '';
      position: absolute; left: 12px; right: 12px; bottom: 14px;
      height: 1px; background: rgba(31,26,20,0.08);
    }
    .prep-text { min-width: 0; }
    .prep-status {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 700; letter-spacing: -0.01em;
      color: var(--text-2);
      padding: 5px 10px 5px 9px;
      background: var(--border);
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .prep-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 0 rgba(237,120,31, 0.55);
      animation: prep-pulse 1.8s ease-out infinite;
      flex-shrink: 0;
    }
    @keyframes prep-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(237,120,31, 0.45); }
      70%  { box-shadow: 0 0 0 7px rgba(237,120,31, 0); }
      100% { box-shadow: 0 0 0 0 rgba(237,120,31, 0); }
    }
    .prep-title {
      font-size: 17px; font-weight: 800;
      letter-spacing: -0.02em; line-height: 1.4;
      color: var(--text-1);
      margin: 0 0 6px;
    }
    .prep-desc {
      font-size: 13px; line-height: 1.6;
      color: var(--text-2); margin: 0;
    }
    .prep-foot {
      grid-column: 1 / -1;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .prep-eta {
      font-size: 12px; color: var(--text-3); font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px;
      font-variant-numeric: tabular-nums;
    }
    .prep-eta-clock { width: 12px; height: 12px; opacity: 0.7; }
    .prep-cta {
      font-size: 13px; font-weight: 700; color: var(--blue);
      letter-spacing: -0.01em;
      display: inline-flex; align-items: center; gap: 4px;
      background: none; border: none; padding: 0; cursor: pointer;
    }
    .prep-cta:hover { color: var(--blue-dark); }

    /* ===== Cow animations (same as showcase) ===== */
    .cow svg { display: block; overflow: visible; }
    .cow .cow-body-grp {
      transform-origin: 70px 80px;
      animation: cow-breathe 3.4s ease-in-out infinite;
    }
    @keyframes cow-breathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.02); }
    }
    .cow-sleeping .cow-body-grp { animation: cow-sleep-bob 3.6s ease-in-out infinite; }
    @keyframes cow-sleep-bob {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(3px) scale(1.025); }
    }
    .zzz .z { opacity: 0; }
    .zzz .z1 { animation: zfloat 2.8s ease-out infinite 0s; }
    .zzz .z2 { animation: zfloat 2.8s ease-out infinite 0.9s; }
    .zzz .z3 { animation: zfloat 2.8s ease-out infinite 1.8s; }
    @keyframes zfloat {
      0%   { opacity: 0; transform: translate(0, 6px); }
      20%  { opacity: 1; }
      70%  { opacity: 1; }
      100% { opacity: 0; transform: translate(4px, -10px); }
    }
    .cow-watching .eyes-scan { animation: eyes-scan 2.4s ease-in-out infinite; }
    @keyframes eyes-scan {
      0%, 100% { transform: translateX(-2.5px); }
      50%      { transform: translateX(2.5px); }
    }
    .cow-watching .ear-l { transform-origin: 32px 50px; animation: ear-flick-l 4.8s ease-in-out infinite; }
    .cow-watching .ear-r { transform-origin: 88px 50px; animation: ear-flick-r 4.8s ease-in-out infinite 2.4s; }
    @keyframes ear-flick-l {
      0%, 90%, 100% { transform: rotate(0); }
      93%           { transform: rotate(-10deg); }
      96%           { transform: rotate(2deg); }
    }
    @keyframes ear-flick-r {
      0%, 90%, 100% { transform: rotate(0); }
      93%           { transform: rotate(10deg); }
      96%           { transform: rotate(-2deg); }
    }
    .chart .bar { transform-box: fill-box; transform-origin: bottom center; }
    .chart .bar1 { animation: bar-pulse 1.8s ease-in-out infinite 0s; }
    .chart .bar2 { animation: bar-pulse 1.8s ease-in-out infinite 0.3s; }
    .chart .bar3 { animation: bar-pulse 1.8s ease-in-out infinite 0.6s; }
    @keyframes bar-pulse {
      0%, 100% { transform: scaleY(0.65); }
      50%      { transform: scaleY(1); }
    }
    .cow-organizing .cow-body-grp {
      animation: cow-nod 3.2s ease-in-out infinite;
      transform-origin: 60px 90px;
    }
    @keyframes cow-nod {
      0%, 100% { transform: rotate(0); }
      30%      { transform: rotate(-3deg); }
      70%      { transform: rotate(2deg); }
    }
    .pencil {
      transform-box: fill-box;
      transform-origin: 0% 100%;
      animation: pencil-write 1.4s ease-in-out infinite;
    }
    @keyframes pencil-write {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      50%      { transform: translate(-3px, 1px) rotate(-10deg); }
    }
    .cb-line { stroke-dasharray: 22; }
    .cb-l1 { animation: line-draw 4.5s ease-in-out infinite 0s; }
    .cb-l2 { animation: line-draw 4.5s ease-in-out infinite 1.5s; }
    .cb-l3 { animation: line-draw 4.5s ease-in-out infinite 3s; }
    @keyframes line-draw {
      0%   { stroke-dashoffset: 22; }
      30%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cow *, .prep-dot { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="cow.jsx"></script>
  <script type="text/babel">
    const BANDS = {
      dawn: {
        statusLabel: '오늘 업데이트 예정',
        title: '오늘의 PICK은 잠시 쉬어가고 있어요',
        desc: '밤사이 주요 이슈를 정리해, 장이 시작되면 다시 시장 흐름을 확인할게요.',
        eta: '오전 중 다시 확인',
        cow: 'sleeping',
      },
      morning: {
        statusLabel: '오늘 업데이트 준비 중',
        title: '오늘의 시장 흐름을 확인하고 있어요',
        desc: '주요 뉴스와 장 초반 흐름을 살펴보며 오늘의 PICK을 준비하고 있어요.',
        eta: '오후 업데이트 예정',
        cow: 'watching',
      },
      afternoon: {
        statusLabel: '오늘 업데이트 준비 중',
        title: '오늘의 PICK을 정리하고 있어요',
        desc: '주요 방송과 시장 이슈를 확인하고, 핵심 종목과 섹터 흐름을 정리하고 있어요.',
        eta: '오늘 중 발행',
        cow: 'organizing',
      },
    };

    const Clock = () => (
      <svg className="prep-eta-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3 2"/>
      </svg>
    );

    function PrepCardCow({ band }) {
      const b = BANDS[band];
      return (
        <div className="prep">
          <div className="prep-cow-slot">
            <Cow state={b.cow} size={96} />
          </div>
          <div className="prep-text">
            <div className="prep-status">
              <span className="prep-dot" />
              {b.statusLabel}
            </div>
            <h3 className="prep-title">{b.title}</h3>
            <p className="prep-desc">{b.desc}</p>
          </div>
          <div className="prep-foot">
            <span className="prep-eta"><Clock />{b.eta}</span>
            <button className="prep-cta" type="button">
              최근 PICK 먼저 보기 <span>→</span>
            </button>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <div className="ref-wrap">
          <section className="ref-section">
            <h2>새벽 · 00:00 — 06:00</h2>
            <PrepCardCow band="dawn" />
          </section>
          <section className="ref-section">
            <h2>오전 · 06:00 — 12:00</h2>
            <PrepCardCow band="morning" />
          </section>
          <section className="ref-section">
            <h2>오후 · 12:00 — 발행 전</h2>
            <PrepCardCow band="afternoon" />
          </section>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
