<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>주식요약 — 매일 12시, 장 정리</title>
  <link rel="stylesheet" href="ds/colors_and_type.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Tweaks panel */
    .tweaks-panel {
      position: fixed; bottom: 24px; right: 24px; z-index: 200;
      width: 280px;
      background: #fff; border: 1px solid var(--toss-border);
      border-radius: 16px; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.15);
      padding: 16px; font-family: 'Pretendard Variable', system-ui, sans-serif;
    }
    .tweaks-head { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 14px; color: var(--toss-text-1); }
    .tweaks-head button { width: 24px; height: 24px; border-radius: 6px; color: var(--toss-text-3); font-size: 14px; }
    .tweaks-head button:hover { background: var(--toss-border); color: var(--toss-text-1); }
    .tweaks-section { margin-bottom: 14px; }
    .tweaks-section:last-child { margin-bottom: 0; }
    .tweaks-label { font-size: 11px; color: var(--toss-text-3); font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
    .tweaks-radio { display: flex; gap: 4px; background: var(--toss-bg); padding: 4px; border-radius: 10px; }
    .tweaks-radio button { flex: 1; padding: 8px 6px; border-radius: 7px; font-size: 13px; font-weight: 700; color: var(--toss-text-2); transition: all 140ms ease; }
    .tweaks-radio button.active { background: #fff; color: var(--toss-text-1); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="data.js"></script>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
